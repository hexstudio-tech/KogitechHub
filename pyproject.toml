[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kogitechhub"
version = "0.1.0"
description = "Configuratore Linux per mouse (libratbag), RGB di tastiere e cuffie (OpenRGB) e cuffie USB (HeadsetControl)"
requires-python = ">=3.10"
dependencies = []          # PySide6/PyGObject: pacchetti di sistema oppure .venv locale (run.sh)

[project.scripts]
kogitechhub = "kogitechhub.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kogitechhub = ["qml/*.qml", "qml/*.svg"]
